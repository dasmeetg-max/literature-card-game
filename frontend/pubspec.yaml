name: literature
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+9
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.0.0
  flutter_lints: ^6.0.0
  cupertino_icons: ^1.0.2
  go_router: ^17.2.3
  socket_io_client: ^3.1.4
  provider: ^6.1.2
  http: ^1.6.0
  shared_preferences: ^2.2.2
  wakelock_plus: ^1.1.4
  flutter_native_splash: ^2.4.4
  share_plus: ^13.1.0
  app_links: ^7.0.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"

dependency_overrides:
  objective_c: 9.3.0
